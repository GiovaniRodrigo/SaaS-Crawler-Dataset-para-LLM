<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; padding: 10px; font-family: sans-serif; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 12px; margin-bottom: 2px; }
    input, select { width: 100%; box-sizing: border-box; }
    button { width: 100%; padding: 8px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #9ca3af; }
    .status { margin-top: 10px; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <h3>LLM Crawler</h3>
  <div class="form-group">
    <label>URL da API</label>
    <input type="text" id="api_url" placeholder="http://localhost:8000" value="http://localhost:8000">
  </div>
  <div class="form-group">
    <label>API Token</label>
    <input type="password" id="token" placeholder="Seu Token Sanctum">
  </div>
  <div class="form-group">
    <label>Projeto</label>
    <select id="project"></select>
  </div>
  <button id="capture">Capturar Página</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
